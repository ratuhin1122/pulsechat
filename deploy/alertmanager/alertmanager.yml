global:
  resolve_timeout: 5m

route:
  receiver: webhook-placeholder
  group_by: [alertname, job, route, queue]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: webhook-placeholder
    webhook_configs:
      - url_file: /run/alertmanager/webhook_url
        send_resolved: true
        max_alerts: 50
