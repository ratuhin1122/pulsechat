groups:
  - name: pulsechat
    interval: 15s
    rules:
      - alert: APIHigh5xxRate
        expr: |
          sum(rate(http_request_duration_seconds_count{job="api",route!="GET /ws",status=~"5.."}[5m]))
          / sum(rate(http_request_duration_seconds_count{job="api",route!="GET /ws"}[5m])) > 0.02
        for: 5m
        labels:
          severity: critical
          service: pulsechat
        annotations:
          summary: API 5xx rate exceeds 2%
          description: More than 2% of completed API requests failed with 5xx for 5 minutes; WebSocket lifetimes are excluded.

      - alert: APIHighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum by (le, route) (rate(http_request_duration_seconds_bucket{job="api",route!="GET /ws"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
          service: pulsechat
        annotations:
          summary: API p95 latency exceeds 1 second
          description: A route has p95 latency above 1 second for 10 minutes; WebSocket lifetimes are excluded.

      - alert: AttachmentQueueBacklog
        expr: max by (queue) (queue_depth{job="worker"}) > 100
        for: 10m
        labels:
          severity: warning
          service: pulsechat
        annotations:
          summary: Attachment queue depth exceeds 100
          description: A shared queue has more than 100 waiting tasks for 10 minutes; duplicate inspector samples are not summed.

      - alert: AttachmentHighFailureRate
        expr: |
          sum(rate(attachments_processed_total{job="worker",result=~"error|rejected|infected"}[5m]))
          / sum(rate(attachments_processed_total{job="worker"}[5m])) > 0.10
        for: 10m
        labels:
          severity: warning
          service: pulsechat
        annotations:
          summary: Attachment processing failure rate exceeds 10%
          description: Errors, rejected files and infected files exceed 10% of processing attempts for 10 minutes.

      - alert: ClamAVScanErrors
        expr: sum by (instance) (increase(clamav_scan_errors_total{job="worker"}[5m])) > 0
        labels:
          severity: critical
          service: pulsechat
        annotations:
          summary: ClamAV scan errors are increasing
          description: At least one actual ClamAV scan failed during the last 5 minutes; infections are not scan errors.

      - alert: DatabaseExporterDown
        expr: |
          (up{job=~"postgres-exporter|redis-exporter"} == 0)
          or absent(up{job="postgres-exporter"})
          or absent(up{job="redis-exporter"})
        for: 1m
        labels:
          severity: critical
          service: pulsechat
        annotations:
          summary: PostgreSQL or Redis exporter is unavailable
          description: An exporter scrape has failed or its target has been absent for 1 minute.

      - alert: WebSocketConnectionsDrop
        expr: |
          ((sum(ws_active_connections{job="api"}) or vector(0))
            <= 0.5 * sum(ws_active_connections{job="api"} offset 5m))
          and (sum(ws_active_connections{job="api"} offset 5m) > 0)
        labels:
          severity: critical
          service: pulsechat
        annotations:
          summary: WebSocket connections dropped by at least 50%
          description: The current total is at most half its value 5 minutes ago; missing current series count as zero only when a positive baseline exists.
