name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install worker dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips-dev ffmpeg pkg-config
      - name: Vet
        run: go vet -tags libvips ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --build-tags=libvips --timeout=5m
      - name: Race tests
        run: go test -race -tags libvips ./...

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: api-worker
            dockerfile: Dockerfile
          - name: caddy-web
            dockerfile: deploy/Dockerfile.caddy
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build --file "${{ matrix.dockerfile }}" --tag "pulsechat-${{ matrix.name }}:ci" .
      - name: Validate Caddy configuration
        if: matrix.name == 'caddy-web'
        run: docker run --rm -e DOMAIN=chat.example.com -e ACME_EMAIL=ops@example.com pulsechat-caddy-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
