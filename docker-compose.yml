services:
  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://pulsechat:pulsechat@postgres:5432/pulsechat?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "127.0.0.1:9180:9180"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN to your public hostname}"
      ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL for certificate registration}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    build: .
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:9092:9090"
    expose:
      - "8080"
    environment:
      DATABASE_URL: "postgres://pulsechat:pulsechat@postgres:5432/pulsechat?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET to a random secret of at least 32 bytes}"
      WS_ORIGIN: "https://${DOMAIN:?set DOMAIN to your public hostname}"
      TRUSTED_PROXY_CIDRS: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
      REDIS_URL: "${REDIS_URL-redis://redis:6379/0}"
      STORAGE_DIR: "/app/data"
      HTTP_ADDR: ":8080"
      METRICS_ADDR: ":9090"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}"
      OTEL_TRACES_SAMPLER: "${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}"
      OTEL_TRACES_SAMPLER_ARG: "${OTEL_TRACES_SAMPLER_ARG:-0.1}"
      SHUTDOWN_TIMEOUT: "10s"
    stop_grace_period: 15s
    volumes:
      - uploads_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:9091/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    ports:
      - "127.0.0.1:9091:9091"
    entrypoint: ["/app/worker"]
    environment:
      DATABASE_URL: "postgres://pulsechat:pulsechat@postgres:5432/pulsechat?sslmode=disable"
      REDIS_URL: "${REDIS_URL-redis://redis:6379/0}"
      STORAGE_DIR: "/app/data"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}"
      OTEL_TRACES_SAMPLER: "${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}"
      OTEL_TRACES_SAMPLER_ARG: "${OTEL_TRACES_SAMPLER_ARG:-0.1}"
      SHUTDOWN_TIMEOUT: "10s"
      WORKER_METRICS_ADDR: ":9091"
      CLAMD_ADDR: "clamav:3310"
      INSPECT_ARCHIVES: "${INSPECT_ARCHIVES:-false}"
    volumes:
      - uploads_data:/app/data
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav_data:/var/lib/clamav
      - ./deploy/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc -w 3 127.0.0.1 3310 | grep -qx PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 6m

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pulsechat
      POSTGRES_PASSWORD: pulsechat
      POSTGRES_DB: pulsechat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsechat -d pulsechat"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "postgres:5432/pulsechat?sslmode=disable"
      DATA_SOURCE_USER: "${POSTGRES_EXPORTER_USER:?set POSTGRES_EXPORTER_USER in .env}"
      DATA_SOURCE_PASS: "${POSTGRES_EXPORTER_PASSWORD:?set POSTGRES_EXPORTER_PASSWORD in .env}"
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.94.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: "${REDIS_URL-redis://redis:6379/0}"
      REDIS_USER: "${REDIS_EXPORTER_USER-}"
      REDIS_PASSWORD: "${REDIS_EXPORTER_PASSWORD-}"
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    user: "65534:65534"
    entrypoint: ["/bin/sh", "/etc/alertmanager/start.sh"]
    environment:
      ALERT_WEBHOOK_URL: "${ALERT_WEBHOOK_URL:-http://127.0.0.1:65535/replace-me}"
    ports:
      - "127.0.0.1:9093:9093"
    tmpfs:
      - /run/alertmanager:uid=65534,gid=65534,mode=0700
    volumes:
      - alertmanager_data:/alertmanager
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deploy/alertmanager/start.sh:/etc/alertmanager/start.sh:ro

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
      - ./deploy/loki/loki.yml:/etc/loki/loki.yml:ro

  alloy:
    image: grafana/alloy:v1.21.0
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      DOCKER_PROJECT_FILTER: "com.docker.compose.project=${COMPOSE_PROJECT_NAME:-pulsechat}"
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:3.1.0
    restart: unless-stopped
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4318:4318"
    volumes:
      - tempo_data:/var/tempo
      - ./deploy/tempo/tempo.yml:/etc/tempo/tempo.yml:ro

  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  uploads_data:
  redis_data:
  clamav_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  tempo_data:
  alertmanager_data:
