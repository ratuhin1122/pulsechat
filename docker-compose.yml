services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://pulsechat:pulsechat@postgres:5432/pulsechat?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET to a random secret of at least 32 bytes}"
      WS_ORIGIN: "${WS_ORIGIN:-}"
      REDIS_URL: "${REDIS_URL-redis://redis:6379/0}"
      STORAGE_DIR: "/app/data"
      HTTP_ADDR: ":8080"
      SHUTDOWN_TIMEOUT: "10s"
    stop_grace_period: 15s
    volumes:
      - uploads_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    entrypoint: ["/app/worker"]
    environment:
      DATABASE_URL: "postgres://pulsechat:pulsechat@postgres:5432/pulsechat?sslmode=disable"
      REDIS_URL: "${REDIS_URL-redis://redis:6379/0}"
      STORAGE_DIR: "/app/data"
      SHUTDOWN_TIMEOUT: "10s"
    volumes:
      - uploads_data:/app/data
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pulsechat
      POSTGRES_PASSWORD: pulsechat
      POSTGRES_DB: pulsechat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsechat -d pulsechat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  uploads_data:
  redis_data:
