services:
  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN to your public hostname}"
      ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL for certificate registration}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build: .
    expose:
      - "8080"
    environment:
      DATABASE_URL: "postgres://pulsechat:pulsechat@postgres:5432/pulsechat?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET to a random secret of at least 32 bytes}"
      WS_ORIGIN: "https://${DOMAIN:?set DOMAIN to your public hostname}"
      TRUSTED_PROXY_CIDRS: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
      REDIS_URL: "${REDIS_URL-redis://redis:6379/0}"
      STORAGE_DIR: "/app/data"
      HTTP_ADDR: ":8080"
      SHUTDOWN_TIMEOUT: "10s"
    stop_grace_period: 15s
    volumes:
      - uploads_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    entrypoint: ["/app/worker"]
    environment:
      DATABASE_URL: "postgres://pulsechat:pulsechat@postgres:5432/pulsechat?sslmode=disable"
      REDIS_URL: "${REDIS_URL-redis://redis:6379/0}"
      STORAGE_DIR: "/app/data"
      SHUTDOWN_TIMEOUT: "10s"
      CLAMD_ADDR: "clamav:3310"
      INSPECT_ARCHIVES: "${INSPECT_ARCHIVES:-false}"
    volumes:
      - uploads_data:/app/data
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy

  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav_data:/var/lib/clamav
      - ./deploy/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 6m

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pulsechat
      POSTGRES_PASSWORD: pulsechat
      POSTGRES_DB: pulsechat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsechat -d pulsechat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  uploads_data:
  redis_data:
  clamav_data:
