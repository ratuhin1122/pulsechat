services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://pulsechat:pulsechat@postgres:5432/pulsechat?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET to a random secret of at least 32 bytes}"
      WS_ORIGIN: "${WS_ORIGIN:-}"
      HTTP_ADDR: ":8080"
      SHUTDOWN_TIMEOUT: "10s"
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pulsechat
      POSTGRES_PASSWORD: pulsechat
      POSTGRES_DB: pulsechat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsechat -d pulsechat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
